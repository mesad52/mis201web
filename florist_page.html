<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Florist</title>
  <link rel="stylesheet" href="florist_style.css">
  <link rel="icon" type="image/x-icon" href="images/logo.ico">
</head>
<body>

  <header>
    <div class="logo">
      <img src="images/logo.jpg" alt="Aura Florist Logo" class="logo-img">
      <span>Aura Florist</span>
    </div>
    <nav class="nav-menu">
      <a href="#flowers" style="color: black;">Flowers</a>
    </nav>
  </header>

  <main>
    <h2>Our Flowers</h2>

    <section class="products-grid" id="flowers">
      
      <!-- Flower 1 -->
      <div class="product-card">
        <img src="images/whiterose.webp" alt="White Rose">
        <h3>White Rose Bouquet</h3>
        <p class="price">1900₺</p>
        <a href="floristbuy.html?name=White%20Rose%20Bouquet&price=1900%2C00%20TL&img=images/whiterose.webp"><button>Buy Now</button></a>
      </div>

      <!-- Flower 2 -->
      <div class="product-card">
        <img src="images/redrose.jpg" alt="Red Rose">
        <h3>Classic Red Roses</h3>
        <p class="price">1750₺</p>
        <a href="floristbuy.html?name=Classic%20Red%20Roses&price=1750%2C00%20TL&img=images/redrose.jpg"><button>Buy Now</button></a>
      </div>

      <!-- Flower 3 -->
      <div class="product-card">
        <img src="images/tulipbasket.jpg" alt="Tulip Basket">
        <h3>Spring Tulip Basket</h3>
        <p class="price">1400₺</p>
        <a href="floristbuy.html?name=Spring%20Tulip%20Basket&price=1400%2C00%20TL&img=images/tulipbasket.jpg"><button>Buy Now</button></a>
      </div>

    </section>
  </main>

  <footer>
    <p>&copy; 2026 Aura Florist</p>
  </footer>

</body>
</html>
